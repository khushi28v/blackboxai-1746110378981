<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Real Estate{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-['Roboto']">
    <nav class="bg-white shadow p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'listings:home' %}" class="text-2xl font-bold text-blue-600">Real Estate</a>
            <div>
                <a href="{% url 'listings:home' %}" class="text-gray-700 hover:text-blue-600 px-3">Home</a>
            </div>
        </div>
    </nav>

    <!-- Notification Icon -->
    <div id="notification-container" class="fixed top-4 right-4 z-50">
        <button id="notification-button" class="relative focus:outline-none">
            <i class="fas fa-bell text-2xl text-gray-700 hover:text-blue-600"></i>
            <span id="notification-count" class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white bg-red-600 rounded-full hidden">0</span>
        </button>
        <div id="notification-list" class="hidden mt-2 w-64 bg-white rounded shadow-lg max-h-64 overflow-y-auto"></div>
    </div>

    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-white shadow p-4 mt-8 text-center text-gray-600">
        &copy; 2024 Real Estate Website
    </footer>

    <script>
        const notificationSocket = new WebSocket(
            'ws://' + window.location.host + '/ws/notifications/'
        );

        const notificationButton = document.getElementById('notification-button');
        const notificationCount = document.getElementById('notification-count');
        const notificationList = document.getElementById('notification-list');

        notificationSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const notification = document.createElement('div');
            notification.className = 'p-2 border-b border-gray-200';
            notification.textContent = data.content;
            notificationList.prepend(notification);
            notificationCount.textContent = parseInt(notificationCount.textContent || '0') + 1;
            notificationCount.classList.remove('hidden');
            notificationList.classList.remove('hidden');
        };

        notificationButton.addEventListener('click', () => {
            if (notificationList.classList.contains('hidden')) {
                notificationList.classList.remove('hidden');
            } else {
                notificationList.classList.add('hidden');
                notificationCount.classList.add('hidden');
                notificationCount.textContent = '0';
            }
        });
    </script>
</body>
</html>
